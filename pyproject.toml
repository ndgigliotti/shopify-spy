[project]
name = "shopify-spy"
version = "0.3.0"
description = "Python library and CLI to scrape product data, images, and collections from Shopify and WooCommerce stores"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Nicholas Gigliotti", email = "ndgigliotti@gmail.com" },
]
keywords = [
    "shopify",
    "woocommerce",
    "scraper",
    "spider",
    "library",
    "ecommerce",
    "web-scraping",
    "product-data",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = [
    "typer>=0.15",
    "rich>=13.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "platformdirs>=4.9.4",
    "httpx>=0.28",
    "protego>=0.4",
    "defusedxml>=0.7",
]

[project.urls]
Homepage = "https://github.com/ndgigliotti/shopify-spy"
Repository = "https://github.com/ndgigliotti/shopify-spy"
"Bug Tracker" = "https://github.com/ndgigliotti/shopify-spy/issues"

[project.scripts]
shopify-spy = "shopify_spy.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
]

[tool.ruff.lint.per-file-ignores]
"shopify_spy/_user_agents.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]
markers = [
    "integration: marks tests that hit external services (deselect with '-m not integration')",
    "e2e: runs the CLI against local HTTP servers to check diagnoses (run with '-m e2e')",
]
addopts = "-m 'not integration and not e2e'"
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "respx>=0.22",
    "ruff>=0.9",
    "pre-commit>=4.0",
]
